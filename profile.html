<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SGHMS — Profile</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div id="app">
    <div class="screen-content">
      <div class="profile-header-section">
        <div class="profile-avatar">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
        <div class="profile-info">
          <h3>Rahul Kumar</h3>
          <p>+91 9876543210</p>
        </div>
      </div>
      <div class="profile-menu">
        <a href="family.html" class="profile-menu-item stagger-item">
          <div class="profile-menu-icon personal">👤</div>
          <div class="profile-menu-text">Personal Information</div>
          <div class="profile-menu-arrow"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24">
              <path d="M9 18l6-6-6-6" />
            </svg></div>
        </a>
        <a href="family.html" class="profile-menu-item stagger-item" style="animation-delay: 0.1s">
          <div class="profile-menu-icon abha">🏥</div>
          <div class="profile-menu-text">My ABHA Profile</div>
          <div class="profile-menu-arrow"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24">
              <path d="M9 18l6-6-6-6" />
            </svg></div>
        </a>
        <a href="family.html" class="profile-menu-item stagger-item" style="animation-delay: 0.2s">
          <div class="profile-menu-icon family">👨‍👩‍👧‍👦</div>
          <div class="profile-menu-text">Linked Family Members</div>
          <div class="profile-menu-arrow"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24">
              <path d="M9 18l6-6-6-6" />
            </svg></div>
        </a>
        <a href="complaint.html" class="profile-menu-item stagger-item" style="animation-delay: 0.3s">
          <div class="profile-menu-icon notif">📢</div>
          <div class="profile-menu-text">Grievance & Feedback</div>
          <div class="profile-menu-arrow"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24">
              <path d="M9 18l6-6-6-6" />
            </svg></div>
        </a>
        <div class="profile-menu-item stagger-item" style="animation-delay: 0.4s"
          onclick="alert('Language selection would open here.')">
          <div class="profile-menu-icon lang">🌐</div>
          <div class="profile-menu-text">Language / भाषा</div>
          <div class="profile-menu-arrow"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24">
              <path d="M9 18l6-6-6-6" />
            </svg></div>
        </div>
        <a href="index.html" class="profile-menu-item stagger-item" style="animation-delay: 0.5s">
          <div class="profile-menu-icon logout">🚪</div>
          <div class="profile-menu-text" style="color:var(--accent-red)">Logout</div>
        </a>
      </div>

      <div class="app-footer pb-12" style="border-top:none;margin-top:auto">
        <p>SGHMS Application v1.0.0</p>
        <p>A Government of India Initiative</p>
      </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
        </svg>
        <span>Home</span>
      </a>
      <a href="appointments.html" class="nav-item">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
        <span>Appointments</span>
      </a>
      <a href="queue.html" class="nav-item">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" />
        </svg>
        <span>Queue</span>
      </a>
      <a href="history.html" class="nav-item">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
          <polyline points="14,2 14,8 20,8" />
        </svg>
        <span>History</span>
      </a>
      <a href="profile.html" class="nav-item active">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7" />
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>
  <script src="main.js"></script>
</body>

</html>
