<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SGHMS — Family Members</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
<div id="app">
  <div class="top-bar">
    <a href="profile.html" class="back-btn">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5m7-7l-7 7 7 7"/></svg>
    </a>
    <span class="title">Family Members</span>
  </div>
  
  <div class="screen-content">
    <div class="family-section">
      <div class="family-header">
        <h3>Manage Family</h3>
        <button class="add-member-btn" onclick="alert('Link ABHA flow would open here.')">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Add Member
        </button>
      </div>
      
      <div class="family-list">
        <div class="family-card stagger-item">
          <div class="family-avatar male">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="family-info">
            <h4>Anil Kumar (Self)</h4>
            <p>Male • 35 Years</p>
            <div class="family-abha">ABHA: 1234-5678-9012</div>
          </div>
        </div>
        
        <div class="family-card stagger-item" style="animation-delay: 0.1s">
          <div class="family-avatar female">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="family-info">
            <h4>Sunita Devi (Wife)</h4>
            <p>Female • 32 Years</p>
            <div class="family-abha">ABHA: 9876-5432-1098</div>
          </div>
        </div>
        
        <div class="family-card stagger-item" style="animation-delay: 0.2s">
          <div class="family-avatar male">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="family-info">
            <h4>Ravi Kumar (Son)</h4>
            <p>Male • 8 Years</p>
            <div class="family-abha">ABHA: 4567-8901-2345</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="main.js"></script>
</body>
</html>
