<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SGHMS — Emergency SOS</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
<div id="app">
  <div class="top-bar">
    <a href="dashboard.html" class="back-btn">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5m7-7l-7 7 7 7"/></svg>
    </a>
    <span class="title">Emergency SOS</span>
  </div>
  
  <div class="sos-content">
    <h2 class="text-center" style="font-family:var(--font-heading);font-size:24px;font-weight:700">Need Immediate Help?</h2>
    <p class="text-center text-sm text-gray mt-12 mb-20">Tap the button below to alert emergency services and your emergency contacts.</p>
    
    <button class="sos-button stagger-item" onclick="triggerSOS()">SOS</button>
    
    <div class="sos-info stagger-item">
      <div class="sos-info-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
        <p>National Emergency (112)</p>
      </div>
      <div class="sos-info-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <p>Ambulance Service (108)</p>
      </div>
      <div class="sos-info-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        <p>Alert 2 Emergency Contacts</p>
      </div>
    </div>
    
    <div class="sos-disclaimer stagger-item">
      ⚠️ Warning: Misuse of the SOS feature may result in penalties. Use only in genuine medical emergencies.
    </div>
  </div>
</div>
<script src="main.js"></script>
</body>
</html>
